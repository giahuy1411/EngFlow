# sonar-project.properties — English Learning Platform
# Chạy: sonar-scanner (cần SonarQube server hoặc SonarCloud)

sonar.projectKey=english-learning-platform
sonar.projectName=English Learning Platform
sonar.projectVersion=1.0

# ============ SOURCE ============
sonar.sources=backend/src/main,frontend/src
sonar.tests=backend/src/test

# ============ JAVA BACKEND ============
sonar.java.source=17
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# ============ JAVASCRIPT/VUE FRONTEND ============
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# ============ EXCLUSIONS ============
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/target/**,\
  **/*.min.js,\
  **/migrations/**,\
  **/config/**

sonar.test.exclusions=\
  **/node_modules/**

# ============ QUALITY GATES ============
# Các ngưỡng được set trên SonarQube server:
# Coverage >= 70%
# Duplicated Lines < 5%
# Code Smells = 0 (blocker/critical)
# Bugs = 0 (blocker/critical)
# Vulnerabilities = 0

# ============ ENCODING ============
sonar.sourceEncoding=UTF-8
