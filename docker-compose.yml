services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: engflow-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD}
    ports:
      - "1434:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2019-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./docker/init-db.sql:/init-db.sql
    entrypoint: /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "${SA_PASSWORD}" -C -i /init-db.sql
    restart: "no"

  redis:
    image: redis:alpine
    container_name: engflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    # Evict least-recently-used keys under memory pressure instead of failing writes
    # (default maxmemory-policy=noeviction rejects new writes once the cap is hit).
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: engflow-backend
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://sqlserver:1433;databaseName=english_learning;encrypt=true;trustServerCertificate=true;
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=${SA_PASSWORD}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-qwen2.5}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-http://host.docker.internal:11434/v1}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MINIO_URL=http://minio:9000
      - MINIO_PUBLIC_URL=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - AI_SPEAKING_OLLAMA_BASE_URL=${AI_SPEAKING_OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      - AI_EXERCISE_OLLAMA_BASE_URL=${AI_EXERCISE_OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      - AI_SPEAKING_OLLAMA_MODEL=${AI_SPEAKING_OLLAMA_MODEL:-qwen2.5:3b}
      - AI_SPEAKING_WHISPER_BASE_URL=${AI_SPEAKING_WHISPER_BASE_URL:-http://whisper:9002}
      - SEPAY_WEBHOOK_SECRET=${SEPAY_WEBHOOK_SECRET}
      - SEPAY_BANK_ACCOUNT=${SEPAY_BANK_ACCOUNT}
      - SEPAY_BANK_NAME=${SEPAY_BANK_NAME}
      - SEPAY_API_TOKEN=${SEPAY_API_TOKEN:-}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: engflow-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin123}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  # Local Whisper transcription sidecar (faster-whisper, OpenAI-compatible API).
  # Enables automatic speech-to-text for speaking submissions with no cloud key.
  # Uses CPU by default (int8) to stay light on the 4GB RTX 2050 shared with Ollama;
  # set WHISPER_DEVICE=cuda + WHISPER_COMPUTE_TYPE=float16 to use the GPU instead.
  whisper:
    build:
      context: .
      dockerfile: whisper.Dockerfile
    container_name: engflow-whisper
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-cpu}
      - WHISPER_COMPUTE_TYPE=${WHISPER_COMPUTE_TYPE:-int8}
    ports:
      - "9002:9002"
    volumes:
      - whisper_models:/root/.cache/huggingface
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../frontend.Dockerfile
    container_name: engflow-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_TARGET=http://backend:8080
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

  # Tailscale Funnel: exposes backend /api/webhook/sepay to the public internet
  # with a FIXED hostname (https://engflow-dev.tail7fd1fe.ts.net) — unlike ngrok
  # free tier, the URL never changes across restarts.
  # One-time setup (already done): `tailscale up` in this container + enable
  # Funnel on the tailnet + `tailscale funnel --bg --https=443 http://backend:8080`.
  # Auth state + serve/funnel config persist in ./.tailscale (bind mount).
  # SePay webhook URL: https://engflow-dev.tail7fd1fe.ts.net/api/webhook/sepay
  tailscale:
    image: tailscale/tailscale:latest
    container_name: engflow-tailscale
    hostname: engflow-dev
    environment:
      - TS_AUTH_ONCE=true
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    volumes:
      - ./.tailscale:/var/lib/tailscale
    devices:
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    networks:
      - default
    restart: unless-stopped

  # ngrok tunnel (REPLACED by Tailscale Funnel above — kept commented for rollback)
  # ngrok:
  #   image: ngrok/ngrok:latest
  #   container_name: engflow-ngrok
  #   command: >
  #     start sepay-webhook --config /config/ngrok.yml
  #   environment:
  #     - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
  #   volumes:
  #     - ./ngrok.yml:/config/ngrok.yml:ro
  #   ports:
  #     - "4040:4040"
  #   depends_on:
  #     - backend
  #   restart: unless-stopped

volumes:
  mssql_data:
  redis_data:
  minio_data:
  whisper_models:
