spring.config.import=optional:file:.env[.properties]
spring.application.name=engflow

# Database Configuration (SQL Server)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=english_learning;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway - disabled (using Hibernate ddl-auto instead)
spring.flyway.enabled=false

# SQL Init - seed data on first run
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=true

# CORS Configuration
cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT Configuration
# Secret key 256-bit (base64 or long string)
jwt.secret=${JWT_SECRET}
jwt.expiration=604800000

# Enable debug logging for Conditions Evaluation Report
debug=false

# OpenRouter / Nemotron AI Configuration
openrouter.api-key=${OPENROUTER_API_KEY}
openrouter.model=openrouter/free
openrouter.base-url=https://openrouter.ai/api/v1
