spring.config.import=optional:file:.env[.properties]
spring.application.name=engflow

# Database Configuration (SQL Server)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1434;databaseName=english_learning;encrypt=true;trustServerCertificate=true;}
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:YourPassword123}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway - disabled (using Hibernate ddl-auto instead)
spring.flyway.enabled=false

# SQL Init - seed data on first run
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=true

# CORS Configuration
cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT Configuration
# Secret key 256-bit (base64 or long string)
jwt.secret=${JWT_SECRET}
# Access token TTL: 15 minutes (AGENTS.md security rule: 15-30 min)
jwt.expiration=900000

# Enable debug logging for Conditions Evaluation Report
debug=false

# OpenRouter / AI Configuration (override via env vars in docker-compose)
openrouter.api-key=${OPENROUTER_API_KEY:ollama}
openrouter.model=${OPENROUTER_MODEL:qwen2.5}
openrouter.base-url=${OPENROUTER_BASE_URL:http://localhost:11434/v1}

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:demo}
cloudinary.api-key=${CLOUDINARY_API_KEY:demo}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:demo}

# Gmail SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:test@gmail.com}
spring.mail.password=${MAIL_PASSWORD:testpassword}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Speaking media upload limit
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Speaking Coach media storage
minio.url=${MINIO_URL:http://localhost:9000}
minio.public-url=${MINIO_PUBLIC_URL:${minio.url}}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket=${MINIO_BUCKET:speaking-uploads}

# SePay payment configuration
sepay.bank-account=${SEPAY_BANK_ACCOUNT:123456789}
sepay.bank-name=${SEPAY_BANK_NAME:MBBank}
sepay.webhook.secret=${SEPAY_WEBHOOK_SECRET:supersecret}
sepay.qr-url=${SEPAY_QR_URL:https://qr.sepay.vn/img}
sepay.api-token=${SEPAY_API_TOKEN:}

# Speaking Coach content assessment
ai.speaking.ollama.base-url=${AI_SPEAKING_OLLAMA_BASE_URL:http://localhost:11434}
ai.speaking.ollama.model=${AI_SPEAKING_OLLAMA_MODEL:qwen2.5:1.5b}

# Speaking Coach audio assessment
azure.speech.key=${AZURE_SPEECH_KEY:}
azure.speech.region=${AZURE_SPEECH_REGION:}
speaking.ffmpeg.executable=${SPEAKING_FFMPEG_EXECUTABLE:ffmpeg}
speaking.assessment.timeout-seconds=${SPEAKING_ASSESSMENT_TIMEOUT_SECONDS:60}

# HTML Cleanup Migration (one-time, set to false after running)
engflow.html-cleanup.enabled=false
# cleanup aborted mid-saveAll; manually updating remaining 4

# Exercise Re-seed Migration (one-time, set to false after running)
engflow.exercise-fix.enabled=false

# JSON Data Seeder (disable for fix run)
engflow.seed-json-data=false


# AI Exercise Generation (Ollama local)
ai.exercise.ollama.base-url=${AI_EXERCISE_OLLAMA_BASE_URL:${OPENROUTER_BASE_URL:http://host.docker.internal:11434/v1}}
ai.exercise.ollama.model=qwen2.5:1.5b
ai.exercise.ollama.reviewer-model=qwen2.5:1.5b
ai.exercise.review.max-attempts=3

# TTS for listening exercises
ai.exercise.tts.provider=Z.ai
ai.exercise.tts.Z.ai.api-key=${Z.ai_TTS_API_KEY:}
ai.exercise.tts.Z.ai.voice=en-US-Neural2-C
ai.exercise.tts.supertonic.url=http://localhost:8001

# DuckDuckGo web research
ai.exercise.duckduckgo.enabled=true
